name: Validate crater atlas endpoint
run-name: Validate crater endpoint ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: Validated public HTTPS endpoint (normally the stable CloudFront edge)
        required: true
        type: string
      candidate_id:
        description: Unique supervisor candidate generation
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crater-atlas-endpoint-validation
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate from outside the origin network
        id: validate
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          result=failed
          detail="candidate did not pass public validation"
          if [[ "$ENDPOINT" =~ ^https://([a-z0-9][a-z0-9.-]*\.(lhr\.life|localhost\.run)|[a-z0-9]+\.cloudfront\.net)$ ]] \
             && [[ "$CANDIDATE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            for attempt in 1 2 3; do
              work="$(mktemp -d)"
              gateway_ok=false
              api_ok=false
              targets_ok=false
              if curl -fsS --max-time 20 "$ENDPOINT/gateway-health" -o "$work/gateway.json" \
                 && jq -e '.status == "ok" and .service == "crater-tile-gateway"' "$work/gateway.json" >/dev/null; then
                gateway_ok=true
              fi
              if curl -fsS --max-time 20 -D "$work/api.headers" \
                   -H 'Origin: https://malidib.github.io' "$ENDPOINT/api/health" -o "$work/api.json" \
                 && jq -e '.status == "ok" and .service == "crater-maps" and .ready == true' "$work/api.json" >/dev/null \
                 && tr -d '\r' <"$work/api.headers" | grep -Eiq '^access-control-allow-origin: https://malidib\.github\.io$'; then
                api_ok=true
              fi
              if curl -fsS --max-time 30 -H 'Origin: https://malidib.github.io' \
                   "$ENDPOINT/api/targets" -o "$work/targets.json" \
                 && jq -e '.targets | type == "array" and length > 0' "$work/targets.json" >/dev/null; then
                targets_ok=true
              fi
              rm -rf -- "$work"
              if $gateway_ok && $api_ok && $targets_ok; then
                if [[ "$attempt" == 3 ]]; then
                  result=passed
                  detail="TLS, gateway, ready API, targets, and CORS passed three external checks"
                fi
              else
                result=failed
                detail="external check $attempt failed: gateway=$gateway_ok api=$api_ok targets=$targets_ok"
                break
              fi
              [[ "$attempt" == 3 ]] || sleep 2
            done
          else
            detail="candidate input failed the endpoint or identifier allow-list"
          fi
          printf 'result=%s\n' "$result" >>"$GITHUB_OUTPUT"
          printf 'detail=%s\n' "$detail" >>"$GITHUB_OUTPUT"

      - name: Publish the externally validated state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENDPOINT: ${{ inputs.endpoint }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RESULT: ${{ steps.validate.outputs.result }}
          DETAIL: ${{ steps.validate.outputs.detail }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api_path="repos/${GH_REPO}/contents/craters/config.json"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3 4 5; do
            metadata="$(gh api "$api_path?ref=crater-api-live")"
            sha="$(jq -r '.sha' <<<"$metadata")"
            current="$(jq -r '.content' <<<"$metadata" | tr -d '\n' | base64 -d)"
            if [[ "$(jq -r '.candidateId // empty' <<<"$current")" != "$CANDIDATE_ID" ]] \
               || [[ "$(jq -r '.candidateApiBase // empty' <<<"$current")" != "$ENDPOINT" ]]; then
              printf 'Candidate was superseded before validation completed; no state was changed.\n' >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            active_candidate="$(jq -r '.activeCandidateId // .candidateId // empty' <<<"$current")"
            active_validation="$(jq -r '.activeValidation // .validation // empty' <<<"$current")"
            active_validated_at="$(jq -r '.activeValidatedAt // .validatedAt // empty' <<<"$current")"
            active_bases="$(jq -c '.apiBases // []' <<<"$current")"
            if [[ "$RESULT" == passed ]]; then
              payload="$(jq -cn --arg endpoint "$ENDPOINT" --arg candidate "$CANDIDATE_ID" --arg now "$now" \
                '{schemaVersion:2,status:"online",apiBases:[$endpoint],apiBase:$endpoint,candidateApiBase:$endpoint,candidateId:$candidate,validation:"passed",validatedAt:$now,activeCandidateId:$candidate,activeValidation:"passed",activeValidatedAt:$now,updatedAt:$now}')"
            elif [[ "$(jq -r 'length' <<<"$active_bases")" -gt 0 ]] \
                 && [[ "$active_validation" == passed ]] \
                 && [[ -n "$active_validated_at" ]] \
                 && [[ "$active_candidate" != "$CANDIDATE_ID" ]]; then
              payload="$(jq -cn --argjson bases "$active_bases" --arg endpoint "$ENDPOINT" \
                --arg candidate "$CANDIDATE_ID" --arg detail "$DETAIL" --arg active_candidate "$active_candidate" \
                --arg active_validated_at "$active_validated_at" --arg now "$now" \
                '{schemaVersion:2,status:"online",apiBases:$bases,apiBase:$bases[0],candidateApiBase:$endpoint,candidateId:$candidate,validation:"failed",validationError:$detail,validatedAt:$active_validated_at,activeCandidateId:$active_candidate,activeValidation:"passed",activeValidatedAt:$active_validated_at,updatedAt:$now}')"
            else
              payload="$(jq -cn --arg endpoint "$ENDPOINT" --arg candidate "$CANDIDATE_ID" --arg detail "$DETAIL" --arg now "$now" \
                '{schemaVersion:2,status:"offline",apiBases:[],apiBase:"",candidateApiBase:$endpoint,candidateId:$candidate,validation:"failed",validationError:$detail,validatedAt:null,updatedAt:$now}')"
            fi
            content="$(printf '%s\n' "$payload" | base64 -w0)"
            if gh api --method PUT "$api_path" \
              --raw-field 'message=chore: publish externally validated crater API state' \
              --raw-field "content=$content" --raw-field 'branch=crater-api-live' --raw-field "sha=$sha" >/dev/null; then
              printf '### Endpoint validation: %s\n\n%s\n' "$RESULT" "$DETAIL" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
