name: Crater atlas availability

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: crater-atlas-availability
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check static atlas, CDN, and optional analysis API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          page_url="https://malidib.github.io/craters/"
          bootstrap_url="https://malidib.github.io/craters/catalogue-bootstrap.json"
          webp_url="https://d3t9ha3ks9hdmd.cloudfront.net/tiles/_basemaps/ariel/ariel_schenk_voyager_global_10ppd/0/0/0.webp"
          mvt_url="https://d3t9ha3ks9hdmd.cloudfront.net/tiles/_static/empty.mvt"
          issue_title="Crater atlas availability warning"
          curl_common=(-fsS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30)

          static_error=""
          append_static_error() {
            if [[ -n "$static_error" ]]; then
              static_error="${static_error}; $1"
            else
              static_error="$1"
            fi
          }
          page_html="$(curl "${curl_common[@]}" "$page_url" || true)"
          if [[ "$page_html" != *"Crater catalogues"* ]]; then
            append_static_error "GitHub Pages viewer failed"
          fi
          if ! curl "${curl_common[@]}" "$bootstrap_url" | jq -e '.targets | length > 0' >/dev/null; then
            append_static_error "Static catalogue bootstrap failed"
          fi
          webp_type="$(curl "${curl_common[@]}" -I "$webp_url" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}' || true)"
          [[ "$webp_type" == "image/webp" ]] || append_static_error "CloudFront WebP failed"
          mvt_type="$(curl "${curl_common[@]}" -I "$mvt_url" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}' || true)"
          [[ "$mvt_type" == "application/vnd.mapbox-vector-tile" ]] || append_static_error "CloudFront MVT failed"

          config="$(gh api "repos/${GH_REPO}/contents/craters/config.json?ref=crater-api-live" \
            --jq .content 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)"
          endpoint="$(printf '%s' "$config" | jq -r '.apiBases[0] // .apiBase // empty' 2>/dev/null || true)"
          api_error=""
          if [[ -z "$endpoint" ]]; then
            api_error="The runtime configuration reports live analysis offline"
          else
            healthy=false
            for attempt in 1 2 3; do
              if curl -fsS --max-time 15 -H 'Origin: https://malidib.github.io' "$endpoint/api/health" | jq -e '.status == "ok" and .service == "crater-maps" and .ready == true' >/dev/null; then
                healthy=true
                break
              fi
              sleep 5
            done
            $healthy || api_error="The published live-analysis endpoint failed three probes: $endpoint"
          fi

          gh label create atlas-availability --color C23B53 --description "Automated crater atlas availability monitor" --force >/dev/null
          issue_number="$(gh issue list --state open --label atlas-availability --search "$issue_title in:title" --json number --jq '.[0].number // empty')"
          error="$static_error"
          if [[ -n "$api_error" ]]; then
            [[ -z "$error" ]] || error+=$'\n'
            error+="$api_error"
          fi
          if [[ -n "$error" ]]; then
            printf -v body 'Automated public checks failed at %s.\n\n%s\n\nStatic maps remain independent of the optional live-analysis endpoint unless the message identifies a static or CDN failure.' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$error"
            if [[ -z "$issue_number" ]]; then
              gh issue create --title "$issue_title" --label atlas-availability --body "$body" >/dev/null
            else
              gh issue edit "$issue_number" --body "$body" >/dev/null
            fi
            if [[ -n "$api_error" && -n "$endpoint" ]]; then
              api_path="repos/${GH_REPO}/contents/craters/config.json"
              metadata="$(gh api "$api_path?ref=crater-api-live")"
              sha="$(jq -r '.sha' <<<"$metadata")"
              current="$(jq -r '.content' <<<"$metadata" | tr -d '\n' | base64 -d)"
              current_endpoint="$(jq -r '.apiBases[0] // .apiBase // empty' <<<"$current")"
              if [[ "$current_endpoint" == "$endpoint" ]]; then
                now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                payload="$(jq -cn --arg endpoint "$endpoint" --arg now "$now" --arg error "$api_error" \
                  '{schemaVersion:2,status:"offline",apiBases:[],apiBase:"",candidateApiBase:$endpoint,candidateId:"availability-monitor",validation:"failed",validationError:$error,validatedAt:null,updatedAt:$now}')"
                content="$(printf '%s\n' "$payload" | base64 -w0)"
                gh api --method PUT "$api_path" \
                  --raw-field 'message=chore: mark crater analysis endpoint unavailable' \
                  --raw-field "content=$content" --raw-field 'branch=crater-api-live' --raw-field "sha=$sha" >/dev/null || true
              fi
            fi
            if [[ -n "$static_error" ]]; then
              echo "::error::$static_error"
              exit 1
            fi
            echo "::warning::$api_error"
          elif [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "All automated checks recovered at $(date -u +'%Y-%m-%dT%H:%M:%SZ')." >/dev/null
            gh issue close "$issue_number" --reason completed >/dev/null
          fi
